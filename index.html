<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f3" />
    <title>Indicadores Operacionais</title>

    <!-- Gerados a partir de public/Icone-Aba.png, recortado e centrado num quadrado.
         O .ico (16/32/48) e o fallback; o logo e um traco preto, entao o navegador
         em tema escuro recebe a variante branca, senao o icone some na barra de abas. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark-512.png" sizes="512x512" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Cartao de compartilhamento (WhatsApp, Slack, LinkedIn). O WhatsApp le apenas
         o HTML estatico, sem rodar JavaScript, e exige URL absoluta na imagem.
         O <title> acima continua sendo o nome da aba; quem manda no cartao e og:title. -->
    <meta property="og:title" content="KPIs Conselho Formatar" />
    <meta property="og:description" content="Indicadores operacionais do Conselho Formatar: reunioes, tarefas, produtividade e custo." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="KPIs Conselho Formatar" />
    <meta property="og:url" content="https://dashboard-conselho-formatar.pages.dev/" />
    <meta property="og:image" content="https://dashboard-conselho-formatar.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo do Conselho Formatar" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KPIs Conselho Formatar" />
    <meta name="twitter:description" content="Indicadores operacionais do Conselho Formatar: reunioes, tarefas, produtividade e custo." />
    <meta name="twitter:image" content="https://dashboard-conselho-formatar.pages.dev/og-image.png" />
    <meta name="description" content="Indicadores operacionais do Conselho Formatar: reunioes, tarefas, produtividade e custo." />
    <script>
      // Aplica o tema antes da primeira pintura para evitar flash de cor.
      (function () {
        try {
          var saved = localStorage.getItem('formatar-dashboard-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
